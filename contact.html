<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <title>Contact page for School Website</title>
        <script>
            const currentPage = window.location.pathname.split("/").pop().toLowerCase();
            const authPages = ["login.html", "register.html"];

            if (authPages.includes(currentPage)) {
                if (localStorage.getItem("isLoggedIn") === "true") {
                    window.location.href = "index.html";
                }
            } else if (localStorage.getItem("isLoggedIn") !== "true") {
                window.location.href = "login.html";
            }
        </script>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                background-color: #f4f4f4;
            }   
            header{
                text-align:center;
                padding:20px;
                background: linear-gradient(to bottom,#b0edf9,#04344c);
                display: block;
                flex-wrap: nowrap;
                justify-items: center;
            }
            
            header h1{
                font-size:auto;
                color: rgb(216, 253, 8);
                
            }
            
            header p{
                margin-top:10px;
                font-size:18px;
            }
            
            /* Navigation */
            
            nav{
                background:#1b1b1b;
                display:flex;
                justify-content:center;
                gap:30px;
                padding:15px;
                flex-wrap:wrap;
            }
            
            nav a{
                color:white;
                text-decoration:none;
                font-size:18px;
                transition:0.3s;
            }
            
            nav a:hover{
                color:yellow;
            }
            button {
                background-color: #628d91;
                color: white;
                border: none;
                padding: 4px 3px;
                display: flex;
                cursor: pointer;
                border-radius: 10px;
                gap: 10px;
                animation: buttonAnimation 4s infinite alternate;
                margin-left: 20px;
                margin-right: 30px;
            }
            button:hover {
                background-color: #555;
                animation: none;
            }
            
           form {
                max-width: 500px;
                margin: 20px auto;
                padding: 20px;
                background-color: white;
                border-radius: 10px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }
            input[type="text"], input[type="email"], textarea, input[type="tel"] {
                width: 90%;
                padding: 10px;
                margin: 10px 0;
                border: 1px solid #ccc;
                border-radius: 5px;
            }
            input[type="submit"] {
                background-color: #0a7179;
                color: white;
                border: none;
                padding: 10px 20px;
                cursor: pointer;
                border-radius: 5px;
            }
            input[type="submit"]:hover {
                background-color: #555;
            }
            footer{
                background:#0d5c63;
                color:white;
                text-align:center;
                padding:20px;
                margin-top:30px;
            }
        </style>
    </head>
    <body>
        <header>
           <h1>Sadguru Gadghe Maharaj College</h1>
            <p>Vidyanagar, Saidapur, Tal. Karad, Dist. Satara</p>
        </header>
        
        <nav>
            <a href="index.html">Home</a>
            <a href="About.html">About</a>
            <a href="Admission.html">Admission</a>
            <a href="Academics.html">Academics</a>
            <a href="Facilities.html">Facilities</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>
         <form action="submit_form.php" method="post">
           <center> <h1 style="color:teal">SGM College Contact Form</h1></center>
            <h2>Contact Us</h2>
            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname" placeholder="First Name" required>

            <label for="mname">Middle Name:</label>
            <input type="text" id="mname" name="mname" placeholder="Middle Name" required>

            <label for="sname">Last Name:</label>
            <input type="text" id="sname" name="sname" placeholder="Last Name" required>

            <label for="Mobile Number">Mobile Number:</label>
            <input type="tel" id="MobileNumber" name="Mobile Number" placeholder="Mobile Number" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Email" required>
            
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4"  placeholder="Messege" required></textarea>
            
            <input type="submit" value="Submit">
        </form>
        <footer>
            <p>&copy; 2024 Sadguru Gadghe Maharaj College. All rights reserved.</p>
        </footer>
    </body>
    <script>
        SubmitEvent=('form').on('submit', function(event) {
            event.preventDefault(); 
            
            alert('Form submitted successfully!');
        });
        MobileNumberInput = document.getElementById('Mobile Number');
        MobileNumberInput.addEventListener('input', function() {
            const MobileNumberPattern = /^[0-9]{10}$/;
            if (!MobileNumberPattern.test(MobileNumberInput.value)) {
                MobileNumberInput.setCustomValidity('Please enter a valid 10-digit mobile number.');
            } else {
                MobileNumberInput.setCustomValidity('');
            }
        });
        
        
    </script>
</html>

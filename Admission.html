<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <title>Admission Form - Sadguru Gadghe Maharaj College</title>
        <script>
            const currentPage = window.location.pathname.split("/").pop().toLowerCase();
            const authPages = ["login.html", "register.html"];

            if (authPages.includes(currentPage)) {
                if (localStorage.getItem("isLoggedIn") === "true") {
                    window.location.href = "index.html";
                }
            } else if (localStorage.getItem("isLoggedIn") !== "true") {
                window.location.href = "login.html";
            }
        </script>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                background-color: #f4f4f4;
            }
            header{
                text-align:center;
                padding:20px;
                background: linear-gradient(to bottom,#b0edf9,#04344c);
            }
            
            header h1{
                margin: 0;
                font-size: 2rem;
                color: white;
            }
            
            header p{
                margin-top:10px;
                font-size:18px;
            }
            
            /* Navigation */
            
            nav{
                background:#1b1b1b;
                display:flex;
                justify-content:center;
                gap:30px;
                padding:15px;
                flex-wrap:wrap;
            }
            
            nav a{
                color:white;
                text-decoration:none;
                font-size:18px;
                transition:0.3s;
            }
            
            nav a:hover{
                color:yellow;
            }
            form{
                max-width:600px;
                margin:20px auto;
                padding:20px;
                background:white;
                border-radius:10px;
                box-shadow:0 4px 10px rgba(0,0,0,0.1);
            }
            input, select, textarea{
                width: 100%;
                padding:10px;
                margin:10px 0;
                border:1px solid #ccc;
                border-radius:5px;
                box-sizing: border-box;
            }
            input[type="submit"]{
                background:#0d5c63;
                color:white;
                border:none;
                cursor:pointer;
                transition:0.3s;
                justify-content: center;
            }
            footer{
                background:#0d5c63;
                color:white;
                text-align:center;
                padding:20px;
                margin-top:30px;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Sadguru Gadghe Maharaj College</h1>
            <p>Admission Form</p>
        </header>
        <nav>
            <a href="index.html">Home</a>
            <a href="About.html">About</a>
            <a href="Admission.html">Admission</a>
            <a href="Academics.html">Academics</a>
            <a href="gallery.html">Gallery</a>
            <a href="Facilities.html">Facilities</a>
            <a href="Contact.html">Contact</a>
        </nav>
        <main>
            <h1 style="text-align:center; margin-top:20px;">Admission Form</h1>
            <form action="submit_form.php" method="post">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required><br>

            <label for="course">Course Applying For:</label>
            <select id="course" name="course" required>
                <option value="">Select a course</option>
                <option value="bsc">B.Sc</option>
                <option value="ba">B.A</option>
                <option value="bcom">B.Com</option>
                <option value="bca">BCA</option>
                <option value="msc">M.Sc</option>
                <option value="ma">M.A</option>
                <option value="mcom">M.Com</option>
                <option value="MCA">MCA</option>
            </select><br>
            <label for="year">Year of Admission:</label>
            <select id="year" name="year" required>
                <option value="">Select a year</option>
                <option value="I">1st</option>
                <option value="II">2nd</option>
                <option value="III">3rd</option>
            </select>
            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="4" required></textarea>

            <input type="submit" value="Submit">
        </form>
        </main>
     <footer>
        <p>&copy; 2024 Sadguru Gadghe Maharaj College. All rights reserved.</p>
    </footer>
    <script>
        document.querySelector('form').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent the default form submission

            // Collect form data
            const formData = new FormData(this);
            const data = {};
            formData.forEach((value, key) => {
                data[key] = value;
            });

            // Send the data to the server using fetch
            fetch('submit_form.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                alert('Form submitted successfully!');
                console.log(result);
                this.reset(); // Reset the form after successful submission
            })
            .catch(error => {
                alert('Error submitting form. Please try again.');
                console.error('Error:', error);
            });
        });
    </script>
    </body>
</html>
